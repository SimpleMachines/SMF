name: PHPUnit

on:
  push:
    branches:
      - release-3.0
  pull_request:

jobs:
  phpunit:
    name: Unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        php: [ 8.4, 8.5 ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 #2.37.2
        with:
          php-version: ${{ matrix.php }}
          # apcu and sqlite3 back two of the cache accelerators. Without them
          # those tests skip rather than fail, which reads as a green run that
          # covered more than it did.
          extensions: fileinfo, mbstring, apcu, sqlite3
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress --ansi

      - name: Run the unit tests
        run: composer test -- --colors=always
