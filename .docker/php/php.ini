; SMF 2.1 development settings.
; Values follow other/requirements.md (Requirements + Recommendations).

[PHP]
engine = On
file_uploads = On
post_max_size = 128M
upload_max_filesize = 128M
max_file_uploads = 50
max_input_time = 60
date.timezone = UTC

; The installer's DatabasePopulation step replays a ~2000-statement schema
; script, and each Populate.php block writes hundreds of posts. Both routinely
; run past the recommended 30s.
memory_limit = 1G
max_execution_time = 0

; ForumSettings() probes the board URL with get_headers().
allow_url_fopen = On

; Errors go to the log, never into the response body. This is not just tidiness:
; .docker/baseline/install-forum.sh drives the installer by matching its HTML,
; and .docker/baseline/populate.sh parses CLI output. A stray deprecation notice
; in either stream breaks the baseline generator. Read them with
; `docker compose logs web`.
;
; ~E_DEPRECATED matches what SMF 2.1 sets for itself in index.php on a release
; version; mirroring it here keeps CLI and web behaviour the same.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /dev/stderr

; mbstring.func_overload must stay 0 -- 2.1 breaks if strlen() and friends are
; silently replaced. It defaults to 0 and was removed in PHP 8.0 anyway; this
; note exists so nobody adds it back.

[Session]
session.use_trans_sid = Off
session.save_path = "/tmp"

[mail function]
sendmail_path = "/usr/bin/msmtp -t -i"

[opcache]
; Keep opcache on for realistic behaviour, but always re-read changed files.
; Disabled for CLI: the populate loop runs PHP dozens of times in a row and
; would otherwise pay to compile SMF's sources on every single invocation.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
